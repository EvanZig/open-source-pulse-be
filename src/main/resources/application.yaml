spring:
  application:
    name: open-source-pulse-be

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/osspulse
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      leak-detection-threshold: 5000


  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms

  cache:
    type: redis
    redis:
      time-to-live: 6h
      key-prefix: "osspulse:"
      cache-null-values: false

logging:
  level:
    org.flywaydb: DEBUG

github:
  api:
    token: ${GITHUB_API_TOKEN:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

  