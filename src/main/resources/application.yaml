spring:
  application:
    name: open-source-pulse-be

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/osspulse
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      leak-detection-threshold: 5000


  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: DEBUG

github:
  api:
    token: ${GITHUB_API_TOKEN:}
